id: lp_redirect
label: 'D7 plantid redirects'
migration_tags:
  - lp
source:
  plugin: d7_path_redirect
  key: migrate
process:
  rid: rid
  uid: uid
  redirect_source/path: source
  redirect_source/query:
    plugin: d7_redirect_source_query
    source: source_options
  redirect_redirect/uri:
    plugin: d7_path_redirect
    source:
      - redirect
      - redirect_options
  language:
    plugin: default_value
    default_value: und
    source: language
  status_code:
    plugin: default_value
    default_value: 301
    source: status_code
destination:
  plugin: entity:redirect
migration_dependencies:
  required:
    - lp_user
